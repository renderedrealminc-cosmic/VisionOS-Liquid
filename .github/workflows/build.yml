name: Build VisionOS Liquid Glass APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Liquid Glass UI
        run: |
          npm install
          npm run build

      - name: Generate Android TV Project & Build APK
        run: |
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload VisionOS Liquid Glass APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionOS-Liquid-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
