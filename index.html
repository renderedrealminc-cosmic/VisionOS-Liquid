<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VisionOS • cosmic.inc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * { user-select: none; -webkit-user-select: none; box-sizing: border-box; }
      body { margin: 0; padding: 0; background: #000; color: #fff; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      .liquid-glass {
        background: linear-gradient(135deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 100%);
        backdrop-filter: blur(36px) saturate(210%);
        -webkit-backdrop-filter: blur(36px) saturate(210%);
        border: 1px solid rgba(255,255,255,0.24);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.4);
      }
      .tv-focus-ring:focus, .tv-focused {
        outline: none;
        transform: scale(1.08) translateY(-4px);
        border-color: #00e5ff !important;
        box-shadow: 0 0 32px rgba(0, 229, 255, 0.75), inset 0 1px 2px rgba(255,255,255,0.8) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
